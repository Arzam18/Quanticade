name: Quanticade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Patch process_net to use host compiler
        run: |
          sed -i 's|\$(CC) \$(PROCESS_NET_CFLAGS) -o Tools/process_net|gcc $(PROCESS_NET_CFLAGS) -o Tools/process_net|' Makefile

      - name: Build
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          make CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang \
               NATIVE="" \
               CFLAGS="-g -std=gnu11 -funroll-loops -O3 -fno-exceptions -DIS_64BIT -DNDEBUG -Wall -Wextra -Wno-error=vla -Wpedantic -Wno-unused-command-line-argument -DUSE_NEON -DUSE_SIMD -flax-vector-conversions -DUSE_NEON_DOTPROD -DGIT_HASH=\\\"$GIT_HASH\\\" -DNETWORK_NAME=\\\"net55.nnue\\\" -DEVALFILE=\\\"processed.bin\\\" --target=aarch64-linux-android28 -march=armv8.2-a+dotprod -static-libstdc++"

      - name: List build output
        run: |
          find . -maxdepth 1 -type f -executable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quanticade-android-arm64
          path: Quanticade

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Quanticade Build ${{ github.run_number }}
          prerelease: true
          files: Quanticade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
